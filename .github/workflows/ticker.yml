name: RADAR AGORA

on:
  workflow_dispatch:

  schedule:
    - cron: '0 * * * *'
      timezone: "America/Sao_Paulo"

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:

      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Executar RADAR
        run: node scripts/radar.js

      - name: Publicar ticker
        run: |
          git config user.name "RADAR AGORA"
          git config user.email "radar-agora@users.noreply.github.com"

          git add data/ticker.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteração no ticker."
          else
            git commit -m "Atualizar RADAR AGORA"
            git push
          fi
