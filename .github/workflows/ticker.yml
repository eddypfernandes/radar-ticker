name: RADAR AGORA

on:
  workflow_dispatch:

  schedule:
    - cron: '0 7 * * *'
      timezone: "America/Sao_Paulo"

    - cron: '0 14 * * *'
      timezone: "America/Sao_Paulo"

    - cron: '0 20 * * *'
      timezone: "America/Sao_Paulo"

jobs:
  teste:
    runs-on: ubuntu-latest

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Verificar arquivos
        run: |
          echo "=== DIRETÓRIO ATUAL ==="
          pwd
          echo "=== ARQUIVOS ==="
          ls -la
      - name: Ler configuração
        run: |
          echo "=== CONFIGURAÇÃO ==="
          cat config.json
          echo "=== REGRAS ==="
          cat regras.json
      - name: Extrair notícias da Agência Brasília
        run: |
          curl -L -s "https://www.agenciabrasilia.df.gov.br/noticias" -o noticias.html

          node <<'NODE'
          const fs = require("fs");

          const html = fs.readFileSync("noticias.html", "utf8");

          console.log("=== TAMANHO DO HTML ===");
          console.log(html.length);

          console.log("=== OCORRÊNCIAS DE HREF ===");

          const links = [...html.matchAll(/href=["']([^"']+)["']/gi)];

          let encontrados = 0;

          for (const item of links) {
            const url = item[1];

            if (
              url.includes("/noticia") ||
              url.includes("/web/") ||
              url.includes("/detalhe")
            ) {
              console.log(url);
              encontrados++;
            }

            if (encontrados >= 20) {
              break;
            }
          }

          console.log("=== TOTAL EXIBIDO ===");
          console.log(encontrados);
          NODE
