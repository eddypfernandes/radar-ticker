name: RADAR AGORA

on:
  workflow_dispatch:

  schedule:
    - cron: '0 7 * * *'
      timezone: "America/Sao_Paulo"

    - cron: '0 14 * * *'
      timezone: "America/Sao_Paulo"

    - cron: '0 20 * * *'
      timezone: "America/Sao_Paulo"

jobs:
  teste:
    runs-on: ubuntu-latest

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Verificar arquivos
        run: |
          echo "=== DIRETÓRIO ATUAL ==="
          pwd
          echo "=== ARQUIVOS ==="
          ls -la
          echo "=== SCRIPTS ==="
          ls -la scripts

      - name: Ler configuração
        run: |
          echo "=== CONFIGURAÇÃO ==="
          cat config.json
          echo "=== REGRAS ==="
          cat regras.json

      - name: Coletar fontes do RADAR
        run: node scripts/coletar.js
      - name: Curar conteúdos com Gemini
        run: node scripts/curar.js
