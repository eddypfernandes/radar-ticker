name: RADAR AGORA

on:
  workflow_dispatch:

  schedule:
    - cron: '0 7 * * *'
      timezone: "America/Sao_Paulo"

    - cron: '0 14 * * *'
      timezone: "America/Sao_Paulo"

    - cron: '0 20 * * *'
      timezone: "America/Sao_Paulo"

jobs:
  teste:
    runs-on: ubuntu-latest

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Verificar arquivos
        run: |
          echo "=== DIRETÓRIO ATUAL ==="
          pwd
          echo "=== ARQUIVOS ==="
          ls -la
      - name: Ler configuração
        run: |
          echo "=== CONFIGURAÇÃO ==="
          cat config.json
          echo "=== REGRAS ==="
          cat regras.json
      - name: Testar Gemini com configuração
        run: |
          CONFIG=$(cat config.json)
          REGRAS=$(cat regras.json)

          curl "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent" \
            -H "x-goog-api-key: $GEMINI_API_KEY" \
            -H "Content-Type: application/json" \
            -X POST \
            -d "$(jq -n \
              --arg config "$CONFIG" \
              --arg regras "$REGRAS" \
              '{
                contents: [
                  {
                    parts: [
                      {
                        text: ("Leia a configuração abaixo e responda somente: CONFIGURAÇÃO RECEBIDA.\n\nCONFIGURAÇÃO:\n" + $config + "\n\nREGRAS:\n" + $regras)
                      }
                    ]
                  }
                ]
              }'
            )"
