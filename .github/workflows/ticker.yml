name: RADAR AGORA

on:
  workflow_dispatch:

  schedule:
    - cron: '0 7 * * *'
      timezone: "America/Sao_Paulo"

    - cron: '0 14 * * *'
      timezone: "America/Sao_Paulo"

    - cron: '0 20 * * *'
      timezone: "America/Sao_Paulo"

jobs:
  teste:
    runs-on: ubuntu-latest

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Verificar arquivos
        run: |
          echo "=== DIRETÓRIO ATUAL ==="
          pwd
          echo "=== ARQUIVOS ==="
          ls -la
      - name: Ler configuração
        run: |
          echo "=== CONFIGURAÇÃO ==="
          cat config.json
          echo "=== REGRAS ==="
          cat regras.json
      - name: Extrair notícias da Agência Brasília
        run: |
          curl -L -s "https://www.agenciabrasilia.df.gov.br/noticias" -o noticias.html      - name: Coletar fontes do RADAR
        run: |
          node <<'NODE'
          const fs = require("fs");
          const https = require("https");
          const http = require("http");

          const config = JSON.parse(fs.readFileSync("config.json", "utf8"));

          const fontes = config.fontes.filter(fonte => fonte.ativo === true);

          const resultados = [];

          function baixar(url) {
            return new Promise((resolve, reject) => {
              const cliente = url.startsWith("https://") ? https : http;

              cliente.get(url, {
                headers: {
                  "User-Agent": "RADAR-AGORA/1.0"
                }
              }, resposta => {
                let dados = "";

                resposta.setEncoding("utf8");

                resposta.on("data", parte => {
                  dados += parte;
                });

                resposta.on("end", () => {
                  if (resposta.statusCode >= 200 && resposta.statusCode < 400) {
                    resolve(dados);
                  } else {
                    reject(new Error(`HTTP ${resposta.statusCode}`));
                  }
                });

              }).on("error", reject);
            });
          }

          function limparTexto(texto) {
            return texto
              .replace(/<!\[CDATA\[|\]\]>/g, "")
              .replace(/<[^>]*>/g, "")
              .replace(/&amp;/g, "&")
              .replace(/&quot;/g, '"')
              .replace(/&#39;/g, "'")
              .replace(/&lt;/g, "<")
              .replace(/&gt;/g, ">")
              .replace(/\s+/g, " ")
              .trim();
          }

          function adicionarResultado(titulo, url, fonte) {
            titulo = limparTexto(titulo);
            url = limparTexto(url);

            if (!titulo || !url) {
              return;
            }

            if (!/^https?:\/\//i.test(url)) {
              return;
            }

            resultados.push({
              titulo,
              url,
              fonte
            });
          }

          function coletarRSS(xml, fonte) {
            const itens = [...xml.matchAll(/<item[\s\S]*?<\/item>/gi)];

            for (const item of itens) {
              const bloco = item[0];

              const titulo = bloco.match(/<title[^>]*>([\s\S]*?)<\/title>/i);
              const link = bloco.match(/<link[^>]*>([\s\S]*?)<\/link>/i);

              if (titulo && link) {
                adicionarResultado(
                  titulo[1],
                  link[1],
                  fonte.nome
                );
              }
            }
          }

          function coletarHTML(html, fonte) {
            const links = [...html.matchAll(
              /<a\b[^>]*href=["']([^"']+)["'][^>]*>([\s\S]*?)<\/a>/gi
            )];

            for (const item of links) {
              let url = item[1];
              const titulo = limparTexto(item[2]);

              if (!titulo) {
                continue;
              }

              if (url.startsWith("/")) {
                const base = new URL(fonte.url);
                url = `${base.origin}${url}`;
              }

              if (!/^https?:\/\//i.test(url)) {
                continue;
              }

              if (url === fonte.url) {
                continue;
              }

              adicionarResultado(
                titulo,
                url,
                fonte.nome
              );
            }
          }

          async function executar() {
            console.log("=== RADAR AGORA ===");
            console.log("Fontes ativas:", fontes.length);
            console.log("");

            for (const fonte of fontes) {
              console.log(`Coletando: ${fonte.nome}`);
              console.log(`Tipo: ${fonte.tipo}`);
              console.log(`URL: ${fonte.url}`);

              try {
                const conteudo = await baixar(fonte.url);

                if (fonte.tipo === "rss") {
                  coletarRSS(conteudo, fonte);
                } else {
                  coletarHTML(conteudo, fonte);
                }

                console.log("OK");
              } catch (erro) {
                console.log(`ERRO: ${erro.message}`);
              }

              console.log("");
            }

            const unicos = [];
            const urls = new Set();

            for (const item of resultados) {
              if (!urls.has(item.url)) {
                urls.add(item.url);
                unicos.push(item);
              }
            }

            fs.writeFileSync(
              "fontes_coletadas.json",
              JSON.stringify(
                {
                  total: unicos.length,
                  itens: unicos
                },
                null,
                2
              )
            );

            console.log("=== RESULTADO ===");
            console.log(`Itens coletados: ${unicos.length}`);
            console.log("Arquivo: fontes_coletadas.json");

            console.log("");
            console.log("=== PRIMEIROS ITENS ===");

            unicos.slice(0, 20).forEach((item, indice) => {
              console.log(`${indice + 1}. ${item.titulo}`);
              console.log(`   ${item.url}`);
              console.log(`   Fonte: ${item.fonte}`);
            });
          }

          executar();
          NODE
